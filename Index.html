<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-Commerce Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            padding: 30px;
        }

        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .product {
            background-color: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .product img {
            width: 180px;
            height: 150px;
            object-fit: cover;
        }

        .product button {
            background-color: #222;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        .product button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <header>
        <h1>🛒 My E-Commerce Store</h1>
        <p>Welcome to our online shopping website</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart 🛒</a>
        <a href="#">Login</a>
    </nav>

    <div class="container">

        <h2>Our Products</h2>

        <div class="products">

            <div class="product">
                <img src="https://via.placeholder.com/180" alt="Product">
                <h3>Smart Watch</h3>
                <p>₹1,999</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://via.placeholder.com/180" alt="Product">
                <h3>Headphones</h3>
                <p>₹999</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://via.placeholder.com/180" alt="Product">
                <h3>Backpack</h3>
                <p>₹799</p>
                <button>Add to Cart</button>
            </div>

        </div>

    </div>

</body>
</html>
